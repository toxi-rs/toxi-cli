[package]
name = "toxi-cli"
version = "3.1.0"
edition = "2021"
authors = ["Meshack Bahati Ouma <bahatikylemeshack@gmail.com>"]
description = "CLI tool for the Toxi web framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/meshackbahati/toxi"
keywords = ["cli", "web", "framework", "scaffolding", "generator"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["tests/**", "/doc/**", "/docs/**", "/tmp/**", "/dist/**"]

[[bin]]
name = "toxi"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.31", features = ["derive"] }
bytes = "1.10.0"
http-body-util = "0.1.3"
hyper = "1.6.0"
toxi-core = { version = "3.1.1-2", path = "../toxi-core" }
toxi-middleware = { version = "3.1.0", path = "../toxi-middleware" }
toxi-db = { version = "3.1.0", path = "../toxi-db" }
toxi-config = { version = "3.1.0", path = "../toxi-config" }
toxi-queue = { version = "3.1.0", path = "../toxi-queue" }
toxi-auth = { version = "3.1.0", path = "../toxi-auth" }
toxi-template = { version = "3.1.0", path = "../toxi-template" }
toxi-cache = { version = "3.1.0", path = "../toxi-cache" }
toxi-realtime = { version = "3.1.0", path = "../toxi-realtime" }
toxi-mail = { version = "3.1.0", path = "../toxi-mail" }
toxi-storage = { version = "3.1.0", path = "../toxi-storage" }
toxi-macros = { version = "3.1.0", path = "../toxi-macros" }
toxi-utils = { version = "3.1.0", path = "../toxi-utils" }
toxi-openapi = { version = "3.1.0", path = "../toxi-openapi" }
toxi-graphql = { version = "3.1.0", path = "../toxi-graphql" }
toxi-plugin = { version = "3.1.0", path = "../toxi-plugin" }
tokio = { version = "1.42.0", features = ["full"] }
chrono = "0.4.42"
dialoguer = "0.11.0"
colored = "2.2.0"
notify = "6.1.1"
syn = { version = "2.0.117", features = ["full", "extra-traits"] }
quote = "1.0.45"
proc-macro2 = "1.0.106"
reqwest = { version = "0.12", features = ["json"] }
dotenv = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nix = { version = "0.29", features = ["signal"] }

[dev-dependencies]
tempfile = "3.13"
